<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .heart {
      position: relative;
      width: 700px;
      height: 650px;
      color: #ff1a4d;
      text-shadow: 0 0 15px #ff4d7e, 0 0 30px #ff80a3;
      animation: pulse 2s infinite alternate;
    }

    .container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 6px;
      padding: 20px;
    }

    .love {
      font-size: 13.5px;
      font-family: 'Courier New', monospace;
      text-align: center;
      white-space: nowrap;
      opacity: 0.9;
      transition: all 0.4s;
    }

    .love:hover {
      color: white;
      transform: scale(1.6);
      text-shadow: 0 0 20px white;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 10px #ff1a4d, 0 0 25px #ff4d7e; }
      to { text-shadow: 0 0 20px #ff1a4d, 0 0 40px #ff4d7e, 0 0 60px #ff80a3; }
    }
  </style>
</head>
<body>
  <div class="heart">
    <div class="container" id="heartContainer">
      <!-- JavaScript ile doldurulacak -->
    </div>
  </div>

  <script>
    const texts = [
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU",
      "I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU","I LOVE YOU"
    ];

    const container = document.getElementById('heartContainer');
    
    // Kalp şeklinde dizmek için özel pozisyonlar
    texts.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'love';
      span.textContent = text;
      container.appendChild(span);
    });

    // Tıklayınca efekt
    document.querySelector('.heart').addEventListener('click', () => {
      const loves = document.querySelectorAll('.love');
      loves.forEach((el, i) => {
        setTimeout(() => {
          el.style.transform = 'scale(2.2)';
          el.style.color = '#ffffff';
          setTimeout(() => {
            el.style.transform = 'scale(1)';
            el.style.color = '#ff1a4d';
          }, 800);
        }, i * 12);
      });
    });
  </script>
</body>
</html>
